<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030b14">

    <title>SpeakSafe - Assessment</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#030b14',
                        brandTeal: '#00b4d8',
                        brandTealHover: '#0096b4',
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .dot-matrix {
            background-image:
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .glass-panel {
            background: rgba(4, 15, 26, 0.6);
            backdrop-filter: blur(16px);
        }

        .quiz-option {
            transition: all 0.3s ease;
        }

        .quiz-option:hover {
            transform: translateX(8px);
        }

        .progress-bar {
            transition: width 0.3s ease;
        }

        .result-card {
            animation: fadeIn .5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-brandDark text-white antialiased dot-matrix">

    <!-- HEADER -->
    <header
        class="fixed top-0 left-0 w-full z-40 bg-brandDark/80 backdrop-blur-md border-b border-white/5">

        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

            <a href="./index.html" class="flex items-center gap-3">

                <div
                    class="w-8 h-8 rounded-xl border-2 border-brandTeal flex items-center justify-center">
                    <i class="fa-solid fa-shield-halved text-brandTeal text-sm"></i>
                </div>

                <span class="text-xl font-bold tracking-tight">
                    Speak<span class="text-brandTeal">Safe</span>
                </span>

            </a>

            <button
                onclick="location.href='./index.html'"
                class="bg-brandTeal hover:bg-brandTealHover text-brandDark font-bold px-4 py-2 rounded-full text-sm">
                Back to Home
            </button>

        </div>

    </header>

    <!-- MAIN -->
    <section class="pt-32 pb-16 px-6">

        <div class="max-w-4xl mx-auto">

            <!-- START -->
            <div id="start-screen" class="text-center">

                <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
                    Bullying Assessment Center
                </h1>

                <p class="text-white/60 mb-12">
                    Choose an option below to get started
                </p>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- QUIZ -->
                    <div
                        class="glass-panel rounded-2xl p-8 border border-white/10 cursor-pointer hover:border-brandTeal/50 transition-all"
                        onclick="startQuiz()">

                        <div class="w-20 h-20 rounded-full bg-brandTeal/20 flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-clipboard-list text-brandTeal text-3xl"></i>
                        </div>

                        <h2 class="text-2xl font-bold text-white mb-2">
                            Am I Being Bullied?
                        </h2>

                        <p class="text-white/50 text-sm">
                            Take our self-assessment quiz to understand if you're experiencing bullying.
                        </p>

                    </div>

                    <!-- SURVEY -->
                    <div
                        class="glass-panel rounded-2xl p-8 border border-white/10 cursor-pointer hover:border-brandTeal/50 transition-all"
                        onclick="startSurvey()">

                        <div class="w-20 h-20 rounded-full bg-purple-500/20 flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-chart-line text-purple-500 text-3xl"></i>
                        </div>

                        <h2 class="text-2xl font-bold text-white mb-2">
                            Bullying Survey
                        </h2>

                        <p class="text-white/50 text-sm">
                            Share your experience to help us understand bullying patterns.
                        </p>

                    </div>

                </div>

            </div>

            <!-- QUIZ/SURVEY CONTAINER -->
            <div id="quiz-container" class="hidden">

                <div class="glass-panel rounded-2xl p-8 border border-white/10">

                    <div class="mb-8">

                        <div class="flex justify-between mb-3">

                            <h2 id="mode-title" class="text-2xl font-bold">
                                Assessment Questions
                            </h2>

                            <span id="progress-text" class="text-brandTeal">
                                Question 1/10
                            </span>

                        </div>

                        <div class="w-full bg-white/10 rounded-full h-2">

                            <div
                                id="progress-bar"
                                class="bg-brandTeal h-2 rounded-full progress-bar"
                                style="width:10%">
                            </div>

                        </div>

                    </div>

                    <div id="question-container"></div>

                    <div class="flex justify-between mt-10">

                        <button
                            id="prev-btn"
                            onclick="prevQuestion()"
                            class="hidden bg-white/10 hover:bg-white/20 px-6 py-2 rounded-xl">
                            Previous
                        </button>

                        <button
                            id="next-btn"
                            onclick="nextQuestion()"
                            class="ml-auto bg-brandTeal hover:bg-brandTealHover text-brandDark font-bold px-6 py-2 rounded-xl">
                            Next
                        </button>

                    </div>

                </div>

            </div>

            <!-- RESULTS -->
            <div id="results-container" class="hidden">

                <div
                    id="results-content"
                    class="glass-panel rounded-2xl p-8 border border-white/10 result-card">
                </div>

                <div class="flex justify-center gap-4 mt-6">

                    <button
                        onclick="downloadPDF()"
                        class="bg-brandTeal hover:bg-brandTealHover text-brandDark font-bold px-8 py-3 rounded-xl">
                        <i class="fa-solid fa-download"></i>
                        Save PDF
                    </button>

                    <button
                        onclick="restartQuiz()"
                        class="bg-white/10 hover:bg-white/20 px-8 py-3 rounded-xl">
                        Restart
                    </button>

                </div>

            </div>

        </div>

    </section>

    <script>

        // 10 QUIZ QUESTIONS (Am I Being Bullied?)
        const questions = [
            {
                text: "Do you feel scared or anxious about going to school or going online?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Have others said mean or hurtful things to you online or in person?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Do you feel left out or excluded on purpose by others?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Have rumors been spread about you?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Do you receive threatening or intimidating messages?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Has someone shared embarrassing photos/videos of you without permission?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Do you feel like you can't be yourself because of how others might react?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Have you lost friends because of someone's actions towards you?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Do you feel helpless or hopeless about the situation?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            },
            {
                text: "Has the situation affected your grades or school performance?",
                options: ["Never", "Rarely", "Sometimes", "Often", "Always"]
            }
        ];

        // 10 SURVEY QUESTIONS
        const surveyQuestions = [
            {
                text: "What is your age range?",
                options: ["Under 13", "13-15", "16-18", "19-24", "25+"]
            },
            {
                text: "Where does the bullying primarily occur?",
                options: ["School/Work", "Online (Social Media)", "Both", "Neighborhood", "Other"]
            },
            {
                text: "How long has this been happening?",
                options: ["Less than a week", "1-4 weeks", "1-3 months", "4-6 months", "More than 6 months"]
            },
            {
                text: "What platforms do you experience bullying on?",
                options: ["Instagram", "TikTok", "Snapchat", "Discord", "Twitter/X", "Facebook", "School", "Other"]
            },
            {
                text: "Have you told anyone about what's happening?",
                options: ["Yes, a parent", "Yes, a teacher", "Yes, a friend", "No one", "Yes, a therapist"]
            },
            {
                text: "How has this affected your mental health?",
                options: ["Not at all", "Mildly", "Moderately", "Severely", "Extremely"]
            },
            {
                text: "Have you missed school or work because of bullying?",
                options: ["Never", "Once or twice", "Several times", "Often", "Always"]
            },
            {
                text: "Do you know who is bullying you?",
                options: ["Yes, classmates", "Yes, strangers online", "Yes, former friends", "No, anonymous", "Multiple people"]
            },
            {
                text: "Have you considered seeking professional help?",
                options: ["Already receiving help", "Considering it", "Not sure", "No", "Don't need it"]
            },
            {
                text: "How safe do you feel overall?",
                options: ["Very safe", "Somewhat safe", "Neutral", "Unsafe", "Very unsafe"]
            }
        ];

        let currentIndex = 0;
        let answers = new Array(questions.length).fill(null);
        let surveyAnswers = new Array(surveyQuestions.length).fill(null);
        let currentMode = "quiz";

        function startQuiz() {
            currentMode = "quiz";
            document.getElementById("mode-title").innerText = "Bullying Self-Assessment Quiz";
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("quiz-container").classList.remove("hidden");
            currentIndex = 0;
            renderQuestion();
        }

        function startSurvey() {
            currentMode = "survey";
            document.getElementById("mode-title").innerText = "Bullying Experience Survey";
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("quiz-container").classList.remove("hidden");
            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const data = currentMode === "quiz" ? questions : surveyQuestions;
            const answersArray = currentMode === "quiz" ? answers : surveyAnswers;
            const q = data[currentIndex];
            const container = document.getElementById("question-container");

            container.innerHTML = `
                <h3 class="text-xl font-semibold text-white mb-6">
                    ${currentIndex + 1}. ${q.text}
                </h3>
                <div class="space-y-3">
                    ${q.options.map(option => `
                        <label class="quiz-option flex items-center p-4 bg-white/5 rounded-xl border border-white/10 cursor-pointer hover:bg-white/10">
                            <input
                                type="radio"
                                name="answer"
                                value="${option}"
                                ${answersArray[currentIndex] === option ? 'checked' : ''}
                                class="w-4 h-4 mr-3">
                            <span class="text-white/80">
                                ${option}
                            </span>
                        </label>
                    `).join("")}
                </div>
            `;

            document.querySelectorAll('input[name="answer"]').forEach(radio => {
                radio.addEventListener("change", e => {
                    answersArray[currentIndex] = e.target.value;
                });
            });

            const progress = ((currentIndex + 1) / data.length) * 100;
            document.getElementById("progress-bar").style.width = `${progress}%`;
            document.getElementById("progress-text").innerText = `Question ${currentIndex + 1}/${data.length}`;

            const prevBtn = document.getElementById("prev-btn");
            if (currentIndex === 0) {
                prevBtn.classList.add("hidden");
            } else {
                prevBtn.classList.remove("hidden");
            }

            const nextBtn = document.getElementById("next-btn");
            if (currentIndex === data.length - 1) {
                nextBtn.innerHTML = "Submit";
            } else {
                nextBtn.innerHTML = "Next";
            }
        }

        function nextQuestion() {
            const data = currentMode === "quiz" ? questions : surveyQuestions;
            const answersArray = currentMode === "quiz" ? answers : surveyAnswers;

            if (answersArray[currentIndex] === null) {
                alert("Please select an answer before continuing.");
                return;
            }

            if (currentIndex === data.length - 1) {
                showResults();
            } else {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById("quiz-container").classList.add("hidden");
            document.getElementById("results-container").classList.remove("hidden");

            if (currentMode === "survey") {
                document.getElementById("results-content").innerHTML = `
                    <div class="text-center">
                        <div class="w-20 h-20 rounded-full bg-purple-500/20 flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-chart-line text-purple-400 text-3xl"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-white mb-2">Thank You for Sharing</h2>
                        <p class="text-white/60">Your responses help raise awareness about bullying.</p>
                        <p class="text-white/50 text-sm mt-4">Click "Save PDF" to download your responses.</p>
                    </div>
                `;
                return;
            }

            // Calculate score for quiz
            const scoreMap = { "Never": 1, "Rarely": 2, "Sometimes": 3, "Often": 4, "Always": 5 };
            let total = 0;
            answers.forEach(answer => { total += scoreMap[answer]; });
            const percent = (total / 50) * 100;
            
            let level = "";
            let color = "";
            let message = "";

            if (percent <= 35) {
                level = "Low Risk";
                color = "text-green-400";
                message = "You are showing low signs of being bullied. Stay aware and maintain healthy relationships.";
            } else if (percent <= 65) {
                level = "Moderate Risk";
                color = "text-yellow-400";
                message = "You may be experiencing some bullying behaviors. Consider talking to a trusted adult or counselor.";
            } else {
                level = "High Risk";
                color = "text-red-400";
                message = "You are showing strong signs of being bullied. Please reach out to a trusted adult, counselor, or our support resources immediately.";
            }

            document.getElementById("results-content").innerHTML = `
                <div class="text-center">
                    <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center mx-auto mb-6">
                        <i class="fa-solid fa-chart-simple text-3xl ${color}"></i>
                    </div>
                    <h2 class="text-4xl font-bold mb-4">Assessment Complete</h2>
                    <div class="bg-white/5 rounded-2xl p-8">
                        <h3 class="text-3xl font-bold ${color} mb-4">${level}</h3>
                        <div class="w-full bg-white/10 rounded-full h-4 my-5">
                            <div class="bg-brandTeal h-4 rounded-full" style="width:${percent}%"></div>
                        </div>
                        <p class="text-white/70 text-lg mb-4">Score: ${Math.round(percent)}% (${total}/50)</p>
                        <p class="text-white/60 text-sm">${message}</p>
                    </div>
                    <p class="text-white/50 text-sm mt-6">Click "Save PDF" to download your detailed report with all answers.</p>
                </div>
            `;
        }

        function restartQuiz() {
            currentIndex = 0;
            answers = new Array(questions.length).fill(null);
            surveyAnswers = new Array(surveyQuestions.length).fill(null);
            document.getElementById("results-container").classList.add("hidden");
            document.getElementById("start-screen").classList.remove("hidden");
        }

        function downloadPDF() {
            if (currentMode === "survey") {
                // Survey PDF
                let answersHTML = "";
                surveyQuestions.forEach((q, index) => {
                    answersHTML += `
                        <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 10px;">
                            <h3 style="margin-bottom: 10px; color: #111827; font-size: 16px;">Question ${index + 1}</h3>
                            <p style="margin-bottom: 10px; color: #374151;">${q.text}</p>
                            <p style="color: #0096b4; font-weight: bold;">Answer: ${surveyAnswers[index] || "Not answered"}</p>
                        </div>
                    `;
                });

                const pdfContent = document.createElement("div");
                pdfContent.innerHTML = `
                    <div style="font-family: Arial, sans-serif; padding: 40px; color: #111827;">
                        <h1 style="text-align: center; margin-bottom: 10px; color: #0096b4;">SpeakSafe Survey Report</h1>
                        <p style="text-align: center; color: #6b7280; margin-bottom: 40px;">Generated on ${new Date().toLocaleString()}</p>
                        <div style="background: #f3f4f6; padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: center;">
                            <h2 style="margin-bottom: 10px;">Thank You for Sharing</h2>
                            <p>Your responses help us understand bullying patterns better.</p>
                        </div>
                        <h2 style="margin-bottom: 20px; color: #111827;">Your Survey Responses</h2>
                        ${answersHTML}
                        <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center; color: #6b7280; font-size: 12px;">
                            SpeakSafe © 2026 - Empowering safer digital spaces
                        </div>
                    </div>
                `;

                const opt = {
                    margin: 0.5,
                    filename: 'SpeakSafe_Survey_Report.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(pdfContent).save();
                return;
            }

            // Quiz PDF
            const scoreMap = { "Never": 1, "Rarely": 2, "Sometimes": 3, "Often": 4, "Always": 5 };
            let total = 0;
            answers.forEach(answer => { total += scoreMap[answer]; });
            const percent = (total / 50) * 100;
            
            let level = "";
            if (percent <= 35) level = "Low Risk";
            else if (percent <= 65) level = "Moderate Risk";
            else level = "High Risk";

            let answersHTML = "";
            questions.forEach((q, index) => {
                answersHTML += `
                    <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 10px;">
                        <h3 style="margin-bottom: 10px; color: #111827; font-size: 16px;">Question ${index + 1}</h3>
                        <p style="margin-bottom: 10px; color: #374151;">${q.text}</p>
                        <p style="color: #0096b4; font-weight: bold;">Answer: ${answers[index]}</p>
                    </div>
                `;
            });

            const pdfContent = document.createElement("div");
            pdfContent.innerHTML = `
                <div style="font-family: Arial, sans-serif; padding: 40px; color: #111827;">
                    <h1 style="text-align: center; margin-bottom: 10px; color: #0096b4;">SpeakSafe Assessment Report</h1>
                    <p style="text-align: center; color: #6b7280; margin-bottom: 40px;">Generated on ${new Date().toLocaleString()}</p>
                    <div style="background: #f3f4f6; padding: 20px; border-radius: 12px; margin-bottom: 30px;">
                        <h2 style="margin-bottom: 10px;">Final Result</h2>
                        <p style="font-size: 18px; margin-bottom: 10px;">Risk Level: <strong>${level}</strong></p>
                        <p>Score: <strong>${Math.round(percent)}%</strong> (${total}/50)</p>
                        <div style="background: #e0e0e0; border-radius: 10px; height: 12px; margin-top: 15px;">
                            <div style="background: #0096b4; width: ${percent}%; height: 12px; border-radius: 10px;"></div>
                        </div>
                    </div>
                    <h2 style="margin-bottom: 20px; color: #111827;">Questions & Answers</h2>
                    ${answersHTML}
                    <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center; color: #6b7280; font-size: 12px;">
                        SpeakSafe © 2026 - Empowering safer digital spaces
                    </div>
                </div>
            `;

            const opt = {
                margin: 0.5,
                filename: 'SpeakSafe_Assessment_Report.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(pdfContent).save();
        }

    </script>

</body>

</html>
